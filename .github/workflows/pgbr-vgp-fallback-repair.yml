name: PGBR - conferir PNG fallback VGP sem alteracoes
on:
  push:
    branches: [fix/lt032-vgp-fallback-icon-20261122]
permissions:
  contents: read
concurrency:
  group: pgbr-vgp-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-original-icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Preparar leitura WebP para comparacao com atlas original
        run: python -m pip install Pillow==11.3.0
      - name: Comparar pixels recuperados com celula OFF original
        run: python -B tools/repair_vgp_fallback.py --check
      - name: Verificar chunks PNG CRC e IDAT/zlib
        run: python -B -m unittest discover -s pgrazor/test -p test_map_icons_integrity.py -v
