name: PGBR - reparar fallback VGP original isolado
on:
  push:
    branches: [fix/lt032-vgp-fallback-icon-20261122]
permissions:
  contents: write
concurrency:
  group: pgbr-vgp-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Preparar decodificador WebP para restauracao
        run: python -m pip install Pillow==11.3.0
      - name: Recuperar exatamente os pixels OFF do atlas original
        run: |
          python -B tools/repair_vgp_fallback.py
          python -B tools/repair_vgp_fallback.py --check
      - name: Inspecionar CRC e zlib de todos os icones PNG do mapa
        run: python -B -m unittest discover -s pgrazor/test -p test_map_icons_integrity.py -v
      - name: Registrar somente arquivo binario reparado na branch de QA
        shell: bash
        run: |
          set -euo pipefail
          git add -- pgrazor/assets/map-icons/vgp-device-off.png
          if git diff --cached --quiet; then
            echo "PNG ja valido"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "pgrazor/assets/map-icons/vgp-device-off.png"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(vgp): restore OFF PNG from original WebP atlas"
          git push origin HEAD:refs/heads/fix/lt032-vgp-fallback-icon-20261122
