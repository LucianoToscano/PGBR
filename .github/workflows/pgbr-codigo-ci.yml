name: PGBR - verificacao de codigo em PRs e main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgbr-code-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-host:
    name: Politicas C++ host (sem Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testes C++ independentes de Android
        run: python -B tools/native_host_tests.py

  ndk-abi:
    name: Compilar politicas selecionadas via NDK ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: NDK fixado
        run: sdkmanager "ndk;27.3.13750724"
      - name: Compilar fixtures ARM64 sem executar no host
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          export ANDROID_NDK_HOME="$SDK_ROOT/ndk/27.3.13750724"
          python -B pgrazor/native_harness.py --abi arm64-v8a             auto_raid_policy batch_evolution_policy buddy_emotion_policy             incense_guard_policy remote_gym_policy research_policy shiny_scan_policy
          # Savant-derived Root guard: compile the actual Zygisk loader too.
          CXX="$SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CXX" -std=c++17 -fsyntax-only -I pgrazor/vendor/zygisk pgrazor/zygisk/loader.cpp

  smart-vnext-compile:
    name: Validar sintaxe do executor e host VNext ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: NDK fixado
        run: sdkmanager "ndk;27.3.13750724"
      - name: Compilar sintaxe do host, executor e política nativa
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          CXX="$SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          test -x "$CXX"
          # Combat host includes Dobby's public header. Fetch only the pinned,
          # SHA-verified upstream archive already used by native_build.py.
          DOBBY="$(python3 -c "import sys; from pathlib import Path; sys.path.insert(0,'pgrazor'); import native_build; print(native_build.ensure_dobby(Path('pgrazor'),download=True).resolve())" | tail -n 1)"
          test -f "$DOBBY/include/dobby.h"
          "$CXX" -std=c++17 -fsyntax-only -I pgrazor/native -I "$DOBBY/include" \
            pgrazor/native/combat_host.cpp pgrazor/native/rocket_combat.cpp

  website-build:
    name: Build do website com lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Instalar dependencias exatamente como o lockfile
        working-directory: website
        run: npm ci
      - name: Compilar frontend (sem deploy)
        working-directory: website
        run: npm run build

  project-check:
    name: Suite real check.py + compilacao Java + Root
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PGRAZOR_ANDROID_PLATFORM: android-36
      PGRAZOR_BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK e fontes Android
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preparar DEX fixado antes do gate
        run: python -c "import sys; sys.path.insert(0, 'pgrazor'); import dex_bridges; dex_bridges.dependencies(download=True)"
      - name: Testar Java Python Node geradores e vendor
        run: |
          set -o pipefail
          python -B tools/check.py > /tmp/check.log 2>&1 || {
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -120 /tmp/check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error:|AssertionError|FAIL:|ERROR:|Error' /tmp/check.log | head -25 | while read -r line; do
              echo "::error title=check.py::$(echo "$line" | cut -c1-300)"
            done
            echo "::error title=check.py (fim do log)::$(tail -30 /tmp/check.log | tr '\n' '|' | cut -c1-1500)"
            echo '```'
            tail -60 /tmp/check.log
            echo '```'
            exit 1
          }
      - name: Compilar Java do aplicativo sem entradas de jogo
        run: python -B pgrazor/build.py
      - name: Validar compilacao do instalador Root
        run: python -B pgrazor/rooted_installer.py --check
