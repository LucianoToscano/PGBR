name: PGBR - verificacao de codigo em PRs e main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgbr-code-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-host:
    name: Politicas C++ host (sem Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testes C++ independentes de Android
        run: python -B tools/native_host_tests.py

  project-check:
    name: Suite real check.py + compilacao Java + Root
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PGRAZOR_ANDROID_PLATFORM: android-36
      PGRAZOR_BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK e fontes Android
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preparar DEX fixado antes do gate
        run: python -c "import sys; sys.path.insert(0, 'pgrazor'); import dex_bridges; dex_bridges.dependencies(download=True)"
      - name: Testar Java Python Node geradores e vendor
        run: python -B tools/check.py
      - name: Compilar Java do aplicativo sem entradas de jogo
        run: python -B pgrazor/build.py
      - name: Validar compilacao do instalador Root
        run: python -B pgrazor/rooted_installer.py --check
