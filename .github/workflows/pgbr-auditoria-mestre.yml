name: PGBR - Arquivo Mestre e limpeza segura (read-only)

on:
  push:
    branches:
      - main
      - 'maintenance/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgbr-master-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditoria:
    name: Conferir governança e inventário (sem exclusões)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout de código (sem credenciais persistidas)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python para auditoria
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Java 17 para regressão de Hotspots
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar fusos e coordenadas Hotspots (JVM, somente leitura)
        run: python -B -m unittest discover -s pgrazor/test -p 'test_hotspots_java.py' -v
      - name: Testar novos motores Java (busca, doces, estatísticas, ginásios)
        run: |
          python -B -m unittest discover -s pgrazor/test -p 'test_settings_search_java.py' -v
          python -B -m unittest discover -s pgrazor/test -p 'test_candy_quest_policy_java.py' -v
          python -B -m unittest discover -s pgrazor/test -p 'test_session_stats_history_java.py' -v
          python -B -m unittest discover -s pgrazor/test -p 'test_gym_automation_preferences_java.py' -v
      - name: Testar a política C++ de IV, sem jogo ou dados privados
        run: python -B -m unittest discover -s pgrazor/test -p 'test_transfer_cutoff_host.py' -v
      - name: Verificar sintaxe dos scripts Python novos
        run: python -B -m compileall -q pgrazor/test
      - name: Confirmar fixture Java do Control e eventos de sessão
        run: python -B -m unittest discover -s pgrazor/test -p 'test_control_fixture_contract.py' -v
      - name: Verificar Arquivo Mestre e links internos
        run: python -B -m unittest discover -s pgrazor/test -p 'test_master_governance.py' -v
      - name: Testar o inventário somente leitura
        run: python -B -m unittest discover -s pgrazor/test -p 'test_repo_inventory.py' -v
      - name: Inspecionar a árvore rastreada e alertar sobre resíduos
        run: python -B tools/repo_inventory.py --strict
