name: PGBR - Arquivo Mestre e limpeza segura (read-only)

on:
  push:
    branches:
      - main
      - 'maintenance/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgbr-master-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditoria:
    name: Conferir governança e inventário (sem exclusões)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout de código (sem credenciais persistidas)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python para auditoria
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verificar Arquivo Mestre e links internos
        run: python -B -m unittest discover -s pgrazor/test -p 'test_master_governance.py' -v
      - name: Testar o inventário somente leitura
        run: python -B -m unittest discover -s pgrazor/test -p 'test_repo_inventory.py' -v
      - name: Inspecionar a árvore rastreada e alertar sobre resíduos
        run: python -B tools/repo_inventory.py --strict
