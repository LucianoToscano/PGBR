name: PGBR — PokeList Partner Android Java QA (sem release)
on:
  push:
    branches:
      - feat/pokelist-partner-api-snipers-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK Android 36
        run: sdkmanager 'platforms;android-36'
      - name: Compilar todas as classes com android.jar (Java 8 ABI)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          ANDROID_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          test -s "$ANDROID_JAR"
          mkdir -p /tmp/pgbr-partner/classes /tmp/pgbr-partner/generated
          printf '%s\n' 'package dev.pgrazor; final class BuildVersion { static final String NAME = "0.00.40-LT-Partner-QA"; }' > /tmp/pgbr-partner/generated/BuildVersion.java
          find pgrazor/src -type f -name '*.java' -print0 | sort -z | xargs -0 javac -encoding UTF-8 -source 8 -target 8 -classpath "$ANDROID_JAR" -d /tmp/pgbr-partner/classes /tmp/pgbr-partner/generated/BuildVersion.java
          test -f /tmp/pgbr-partner/classes/dev/pgrazor/PokeListPartnerClient.class
          test -f /tmp/pgbr-partner/classes/dev/pgrazor/SniperPanel.class
          echo 'PASS: Java Android real compilado (sem APK e sem teste em aparelho).'
