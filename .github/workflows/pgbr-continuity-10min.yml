name: PGBR - continuidade e fila a cada 10 minutos

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pgbr-continuity-10min.yml'

permissions: {}
concurrency:
  group: pgbr-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'LucianoToscano/PGBR'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      head: ${{ steps.audit.outputs.head }}
      missing: ${{ steps.audit.outputs.missing }}
    steps:
      - name: Conferir Mestre, fila e CI da main
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          master=$(gh api "repos/$REPO/contents/PGBR_ARQUIVO_MESTRE_UNICO.md?ref=$sha" --jq '.sha')
          [[ "$master" =~ ^[0-9a-f]{40}$ ]]
          issues=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" | jq -s '[.[][] | select(has("pull_request") | not)] | length')
          prs=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" | jq -s '[.[][]] | length')
          queue=$(mktemp)
          trap 'rm -f "$queue"' EXIT
          gh api "repos/$REPO/contents/MESTRE.md?ref=$sha" --jq '.content' | base64 --decode > "$queue"
          # Validate stable numbered IDs; only IDs and counts enter the report.
          queue_report=$(python3 - "$queue" <<'PY'
          import pathlib, re, sys
          def parse(raw):
              rows=[]
              for line in raw.splitlines():
                  if not re.match(r'^\d+\.\s+\[',line):
                      continue
                  match=re.match(r'^(\d+)\.\s+\[([ xX])\]\s+([A-Z][A-Z0-9-]*)(?=\s|$)',line)
                  if not match:
                      raise ValueError("Linha numerada da fila inválida")
                  rows.append((int(match[1]),match[2].lower()=="x",match[3]))
              if not rows or [r[0] for r in rows]!=list(range(1,len(rows)+1)) or len({r[2] for r in rows})!=len(rows):
                  raise ValueError("Fila vazia, numeração descontínua ou ID repetido")
              return rows
          assert parse("1. [x] TEST-01 — concluído\n2. [ ] TEST-02 — aberto")==[(1,True,"TEST-01"),(2,False,"TEST-02")]
          for bad in ("", "1. [ ] TEST-01\n3. [x] TEST-02", "1. [ ] TEST-01\n2. [x] TEST-01"):
              try:
                  parse(bad)
              except ValueError:
                  pass
              else:
                  raise RuntimeError("Teste de integridade da fila falhou")
          rows=parse(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          pending=[r[2] for r in rows if not r[1]]
          print(f"- Itens no MESTRE.md: {len(rows)}; concluídos: {len(rows)-len(pending)}; abertos: {len(pending)}")
          print("- Primeiros IDs abertos na ordem da fila: "+(", ".join(pending[:10]) or "nenhum"))
          print("- Fila sem itens abertos não comprova homologação ou publicação.")
          PY
          )
          missing=0
          {
            printf '# Continuidade PGBR\n\n'
            printf -- '- HEAD da main: [%s](https://github.com/%s/commit/%s)\n' "$sha" "$REPO" "$sha"
            printf -- '- [Arquivo Mestre nesta HEAD](https://github.com/%s/blob/%s/PGBR_ARQUIVO_MESTRE_UNICO.md), blob `%s`\n' "$REPO" "$sha" "$master"
            printf -- '- [Issues abertas](https://github.com/%s/issues): %s\n' "$REPO" "$issues"
            printf -- '- [PRs abertas](https://github.com/%s/pulls): %s\n' "$REPO" "$prs"
            printf '\n## Fila numerada do MESTRE.md na mesma HEAD\n\n%s\n' "$queue_report"
            printf '\n## CI da HEAD (não equivale a teste físico)\n\n'
            for workflow in pgbr-codigo-ci.yml pgbr-auditoria-mestre.yml; do
              runs=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=main&head_sha=$sha&per_page=100")
              count=$(jq -er '.total_count' <<< "$runs")
              printf -- '- %s: ' "$workflow"
              if [[ "$count" == 0 ]]; then
                printf 'sem execução registrada\n'
                missing=1
              else
                jq -r '.workflow_runs[0] | "[run \(.id)](\(.html_url)) — \(.status)/\(.conclusion // "aguardando")"' <<< "$runs"
              fi
            done
            printf '\nFalhas existentes são reportadas, não reexecutadas indefinidamente. PRs, código, versões e releases não são alterados por este fluxo.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'head=%s\nmissing=%s\n' "$sha" "$missing" >> "$GITHUB_OUTPUT"

  recover-missing-ci:
    needs: audit
    if: github.repository == 'LucianoToscano/PGBR' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.audit.outputs.missing == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Disparar somente CI ausente para a HEAD conferida
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.audit.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          for workflow in pgbr-codigo-ci.yml pgbr-auditoria-mestre.yml; do
            current=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
            if [[ "$current" != "$HEAD_SHA" ]]; then
              echo 'main avançou; próxima rodada fará nova auditoria.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            count=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=main&head_sha=$HEAD_SHA&per_page=1" --jq '.total_count')
            if [[ "$count" == 0 ]]; then
              gh workflow run "$workflow" --repo "$REPO" --ref main
              printf 'Solicitado CI ausente: %s\n' "$workflow" >> "$GITHUB_STEP_SUMMARY"
            fi
          done


  auto-dev-proposals:
    needs: audit
    if: github.repository == 'LucianoToscano/PGBR' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PGBR_AUTO_DEV_ENABLED == 'true' && vars.PGBR_AUTO_DEV_MODE == 'free' && vars.PGBR_FREE_BILLING_CONFIRMED == 'true' && vars.PGBR_GITHUB_FREE_BUDGET_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.audit.outputs.head }}
          persist-credentials: false
      - name: Dispatch reviewed batches (proposals only)
        env:
          GH_TOKEN: ${{ github.token }}
          PGBR_AUTO_DEV_ENABLED: ${{ vars.PGBR_AUTO_DEV_ENABLED }}
          PGBR_AUTO_DEV_MODE: ${{ vars.PGBR_AUTO_DEV_MODE }}
          PGBR_FREE_BILLING_CONFIRMED: ${{ vars.PGBR_FREE_BILLING_CONFIRMED }}
          PGBR_GITHUB_FREE_BUDGET_CONFIRMED: ${{ vars.PGBR_GITHUB_FREE_BUDGET_CONFIRMED }}
          PGBR_GEMINI_FREE_KEY: ${{ secrets.PGBR_GEMINI_FREE_KEY }}
          PGBR_GEMINI_FREE_MODEL: ${{ vars.PGBR_GEMINI_FREE_MODEL }}
        run: python3 -B tools/auto_dev_orchestrator.py --queue tools/auto_dev_queue.json --output "$RUNNER_TEMP/pgbr-auto-dev" --live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pgbr-auto-dev-proposals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pgbr-auto-dev/*.json
          if-no-files-found: ignore
          retention-days: 1
