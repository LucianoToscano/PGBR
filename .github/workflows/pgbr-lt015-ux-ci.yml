name: PGBR LT015 - auditoria UI e regressao
on:
  push:
    branches:
      - feature/ux-feedtheme-busca-lt015-20261120
  pull_request:
    branches:
      - maintenance/limpeza-retencao-lt014-20261120
      - main
    paths:
      - 'pgrazor/src/dev/pgrazor/FeedTheme.java'
      - 'pgrazor/src/dev/pgrazor/SettingsUi.java'
      - 'pgrazor/src/dev/pgrazor/MapTheme.java'
      - 'pgrazor/src/dev/pgrazor/QuickMenu.java'
      - 'pgrazor/src/dev/pgrazor/PokemonOptionFilter.java'
      - 'pgrazor/test/PokemonOptionFilterTest.java'
      - '.github/workflows/pgbr-lt015-ux-ci.yml'
permissions:
  contents: read
jobs:
  ux-regression:
    if: github.repository == 'LucianoToscano/PGBR'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PGRAZOR_BUILD_TOOLS: 36.0.0
      PGRAZOR_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36"
      - name: DEX test dependencies
        run: python -c "import sys; sys.path.insert(0, 'pgrazor'); import dex_bridges; dex_bridges.dependencies(download=True)"
      - name: PGBR full source regression suite
        run: python -B tools/check.py
      - name: Android UI and controls build
        run: python -B pgrazor/build.py
      - name: Confirm changes do not leave whitespace errors
        run: git diff --check HEAD^ HEAD
