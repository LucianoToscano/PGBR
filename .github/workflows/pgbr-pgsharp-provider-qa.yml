name: PGBR - QA PGSharp free and optional key

on:
  pull_request:
    branches:
      - main
      - feat/sniper100iv-manual-feed-20261122
    paths:
      - 'pgrazor/src/dev/pgrazor/PgSharp*.java'
      - 'pgrazor/src/dev/pgrazor/FeedChooser.java'
      - 'pgrazor/test/PgSharpFeedPolicyTest.java'
      - 'pgrazor/test/test_pgsharp_provider_contract.py'
      - 'pgrazor/test/test_pgsharp_policy_java.py'
      - '.github/workflows/pgbr-pgsharp-provider-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-policy-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and execute pure Java tier contract
        run: python -B -m unittest discover -s pgrazor/test -p 'test_pgsharp_policy_java.py' -v
      - name: Check source isolation, encrypted local key and existing menu
        run: python -B -m unittest discover -s pgrazor/test -p 'test_pgsharp_provider_contract.py' -v
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Compile every PGBR Android Java source, including PGSharp key vault
        run: |
          mkdir -p /tmp/pgsharp-java-classes /tmp/pgsharp-generated/dev/pgrazor
          printf 'package dev.pgrazor; final class BuildVersion { static final String NAME = "v0.00.33-LT"; }\\n' > /tmp/pgsharp-generated/dev/pgrazor/BuildVersion.java
          find pgrazor/src -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -source 8 -target 8 \\
            -classpath "$ANDROID_HOME/platforms/android-36/android.jar" \\
            -d /tmp/pgsharp-java-classes /tmp/pgsharp-generated/dev/pgrazor/BuildVersion.java
