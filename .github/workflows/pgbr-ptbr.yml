name: PGBR - aplicar traducao PT-BR no codigo
on:
  push:
    branches: [feature/pt-br-traducao]
    paths:
      - '.github/workflows/pgbr-ptbr.yml'
      - 'tools/ptbr_wire.py'
      - 'pgrazor/i18n/pt-BR.json'
permissions:
  contents: write
jobs:
  localize:
    if: github.repository == 'LucianoToscano/PGBR'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Aplicar traducao somente nos limites da interface
        run: |
          python tools/ptbr_wire.py --apply
          python -B -m py_compile tools/ptbr_wire.py
          git diff --check
          python tools/ptbr_wire.py | tee /tmp/ptbr-idempotent.txt
          grep -q '0 Java files' /tmp/ptbr-idempotent.txt
      - name: Compilar classe de localizacao Java e conferir dicionario
        run: |
          mkdir -p /tmp/pgbr-localizacao
          javac -encoding UTF-8 -d /tmp/pgbr-localizacao pgrazor/src/dev/pgrazor/PtBr.java pgrazor/root-installer/src/dev/pgrazor/root/RootPtBr.java
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('pgrazor/i18n/pt-BR.json').read_text(encoding='utf-8'))
          assert data['locale']=='pt-BR'
          assert len(data['translations']) >= 400
          source=Path('pgrazor/src/dev/pgrazor/PtBr.java').read_text(encoding='utf-8')
          root=Path('pgrazor/root-installer/src/dev/pgrazor/root/RootPtBr.java').read_text(encoding='utf-8')
          assert source.count('m.put(') == len(data['translations'])
          assert root.count('m.put(') == len(data['translations'])
          assert 'private static String translateString' in source
          for k,v in data['translations'].items(): assert k and v
          print('PT-BR:',len(data['translations']),'glossary entries verified.')
          PY
      - name: Preparar ferramentas Java, Node e Android para validação integral
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar Android SDK e fontes
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36"
      - name: Validar artefato real antes de autorizar push automatizado
        run: |
          python -c "import sys; sys.path.insert(0, 'pgrazor'); import dex_bridges; dex_bridges.dependencies(download=True)"
          python -B tools/check.py
          python -B pgrazor/build.py
          python -B pgrazor/rooted_installer.py --check
      - name: Registrar apenas a branch isolada (sem APK)
        run: |
          git config user.name "PGBR Translation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pgrazor/src/dev/pgrazor pgrazor/root-installer/src/dev/pgrazor/root
          if ! git diff --cached --quiet; then
            git commit -m "feat(i18n): translate PGRazor UI presentation callsites to PT-BR"
            git push origin HEAD:refs/heads/feature/pt-br-traducao
          fi
