name: PGBR - aplicar traducao PT-BR no codigo
on:
  push:
    branches: [feature/pt-br-traducao]
    paths:
      - '.github/workflows/pgbr-ptbr.yml'
permissions:
  contents: write
jobs:
  localize:
    if: github.repository == 'LucianoToscano/PGBR'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar traducao somente nos limites da interface
        run: |
          python tools/ptbr_wire.py --apply
          python -B -m py_compile tools/ptbr_wire.py
          git diff --check
          python tools/ptbr_wire.py | tee /tmp/ptbr-idempotent.txt
          grep -q '0 Java files' /tmp/ptbr-idempotent.txt
      - name: Compilar classe de localizacao Java e conferir dicionario
        run: |
          mkdir -p /tmp/pgbr-localizacao
          javac -encoding UTF-8 -d /tmp/pgbr-localizacao pgrazor/src/dev/pgrazor/PtBr.java
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('pgrazor/i18n/pt-BR.json').read_text(encoding='utf-8'))
          assert data['locale']=='pt-BR'
          assert len(data['translations']) >= 300
          source=Path('pgrazor/src/dev/pgrazor/PtBr.java').read_text(encoding='utf-8')
          assert source.count('m.put(') == len(data['translations'])
          assert 'private static String translateString' in source
          for k,v in data['translations'].items(): assert k and v
          print('PT-BR:',len(data['translations']),'glossary entries verified.')
          PY
      - name: Registrar apenas a branch isolada (sem APK)
        run: |
          git config user.name "PGBR Translation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pgrazor/src/dev/pgrazor
          if ! git diff --cached --quiet; then
            git commit -m "feat(i18n): translate PGRazor UI presentation callsites to PT-BR"
            git push origin HEAD:refs/heads/feature/pt-br-traducao
          fi
