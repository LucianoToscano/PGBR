name: PGBR - importar codigo PGRazor com historico preservado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pgbr-import-pgrazor.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'LucianoToscano/PGBR'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Importar snapshot completo com bundle de todas as refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESTINATION: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected="f758746f4e1479f4b3105209bdd1d80958605f37"
          git clone https://github.com/jpitty03/PGRazor.git upstream
          actual="$(git -C upstream rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Upstream changed: $actual; expected $expected."
            exit 1
          fi
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${DESTINATION}.git" target
          backup="$(git -C target ls-remote origin 'refs/heads/backup/main-antes-replica-pgrazor-20261118' | cut -f1)"
          if [ -z "$backup" ]; then
            echo "::error::Backup branch absent; import stopped."
            exit 1
          fi
          git -C upstream bundle create ../PGRazor-upstream-full.bundle --all
          git -C upstream bundle verify ../PGRazor-upstream-full.bundle
          bytes="$(wc -c < PGRazor-upstream-full.bundle)"
          if [ "$bytes" -ge 95000000 ]; then
            echo "::error::History bundle exceeds safe GitHub file size ($bytes)."
            exit 1
          fi
          rsync -a --exclude='/.git/' --exclude='/.github/workflows/' upstream/ target/
          mkdir -p target/upstream-workflows target/upstream-history
          cp -a upstream/.github/workflows/. target/upstream-workflows/
          cp PGRazor-upstream-full.bundle target/upstream-history/PGRazor-upstream-full.bundle
          cat > target/PGBR_IMPORTACAO.md <<'EOF'
          # PGBR - replica de pesquisa do PGRazor

          Origem: https://github.com/jpitty03/PGRazor
          Referencia da main: `f758746f4e1479f4b3105209bdd1d80958605f37`
          Importacao para: https://github.com/LucianoToscano/PGBR
          Codigo e recursos do repositorio de origem foram copiados sem executar suas ferramentas.
          `LICENSE` e `THIRD_PARTY.md` devem ser preservados com os creditos originais.
          O codigo original PGRazor e MIT, mas o jogo Pokemon GO e artes de terceiros nao sao cobertos pela MIT.

          Os workflows originais estao preservados em `upstream-workflows/` sem execucao automatica.
          O bundle `upstream-history/PGRazor-upstream-full.bundle` preserva o historico Git,
          os branches e as tags da origem como arquivo restauravel, sem ativar workflows externos.
          Os APKs de GitHub Releases nao estao no repositorio Git e nao foram importados neste snapshot.
          O PokeSearch oficial e seu repositorio nao foram modificados.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          src=Path("upstream")
          dst=Path("target")
          paths=subprocess.check_output(["git","-C","upstream","ls-files","-z"]).split(b"\x00")
          checked=0
          for raw in paths:
              if not raw: continue
              p=raw.decode()
              if p.startswith(".github/workflows/"): continue
              a=(src/p).read_bytes()
              b=(dst/p).read_bytes()
              if hashlib.sha256(a).digest()!=hashlib.sha256(b).digest():
                  raise SystemExit("mismatch: "+p)
              checked+=1
          print(f"Verified {checked} source files, excluding archived workflows")
          PY
          git -C target config user.name "PGBR Import Bot"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add -f --all
          git -C target commit -m "Import PGRazor v0.3.4 source replica, notices and complete upstream Git bundle"
          git -C target push origin HEAD:refs/heads/main
          echo "Source snapshot and archived full history imported successfully."
