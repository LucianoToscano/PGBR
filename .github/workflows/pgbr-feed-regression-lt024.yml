name: PGBR LT024 - regressao dos filtros de resultados
on:
  push:
    branches:
      - fix/lt024-feed-resultados-vazios-20261121
  pull_request:
    branches:
      - feat/lt023-pgsharp-style-two-feeds-20261121
permissions:
  contents: read
jobs:
  feed-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android JSON SDK sources
        run: sdkmanager "sources;android-36"
      - name: Check Java live-feed model and unknown-IV regression
        run: python -B -m unittest discover -s pgrazor/test -p 'test_live_feed_java.py' -v
      - name: Check refusal and offline UI behavior
        run: python -B -m unittest discover -s pgrazor/test -p 'test_pokelist_access_behavior.py' -v
      - name: Check separate search filtering
        run: |
          python -B -m unittest discover -s pgrazor/test -p 'test_pokemon_feed_search_java.py' -v
          python -B -m unittest discover -s pgrazor/test -p 'test_raid_feed_filters_java.py' -v
