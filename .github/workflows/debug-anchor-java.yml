name: DEBUG anchor java
on: workflow_dispatch
jobs:
  javac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile anchor harness
        run: |
          mkdir -p /tmp/anchor-classes
          python3 - <<'PY'
import re
s=open('pgrazor/test/test_route_trace_java.py').read()
m=re.search(r'ANCHOR_HARNESS = r"""(.*?)"""',s,re.S)
open('/tmp/DebugAnchorHarness.java','w').write(m.group(1))
PY
          javac -encoding UTF-8 -d /tmp/anchor-classes pgrazor/src/dev/pgrazor/RouteGroundProjection.java pgrazor/src/dev/pgrazor/RouteAnchorSnapshot.java /tmp/DebugAnchorHarness.java
          java -cp /tmp/anchor-classes dev.pgrazor.RouteAnchorHarness
      - name: Compile all modified Java
        run: |
          mkdir -p /tmp/all-classes
          javac -encoding UTF-8 -d /tmp/all-classes pgrazor/src/dev/pgrazor/RouteAnchorSnapshot.java pgrazor/src/dev/pgrazor/RouteGroundProjection.java
