name: PGBR - coletor IV 100% (fixtures offline)
on:
  pull_request:
    paths:
      - 'tools/hundo-feed/**'
      - '.github/workflows/pgbr-hundo-feed-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -v -s tools/hundo-feed -p 'test_*.py'
