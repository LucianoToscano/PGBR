name: PGBR LT032 - VGP read-only diagnostics QA
on:
  push:
    branches: [integracao/lt032-diagnosticos-recuperados-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vgp-report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testar relatório VGP read-only em Java
        run: python -B pgrazor/test/test_vgp_health_report_java.py
      - name: Conferir estrutura VGP da UI e preservação de controles
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('pgrazor/src/dev/pgrazor/SettingsPanel.java').read_text(encoding='utf-8')
          for required in ('Diagnóstico VGP+ (somente leitura)', 'VgpHealthReport.build(', 'vgpStartStopButton=launch', 'Control.vgpTapProtection()'):
              assert required in s, required
          print('PASS: VGP report and manual action coexist')
          PY
