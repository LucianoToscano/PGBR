# Compila o MESMO aplicativo completo PGBR em PGBR, sem dividir seus recursos.
# A branch de distribuição publica o pré-lançamento após verificar os três pacotes.
name: PGBR - compilar APK completo PT-BR (nuvem)
on:
  push:
    branches:
      - feature/pt-br-traducao
      - feature/lt-hud-historico-locais-20261120
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: Versao de teste (exemplo v0.3.4-ptbr.1)
        required: true
        default: v0.00.11-LT
        type: string
permissions:
  contents: read
concurrency:
  group: pgbr-ptbr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'LucianoToscano/PGBR' && (github.ref_name == 'feature/pt-br-traducao' || github.ref_name == 'feature/lt-hud-historico-locais-20261120')
    # A entrada original pode ser um draft asset, sem publica-la em releases.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PGRAZOR_BUILD_TOOLS: 36.0.0
      PGRAZOR_ANDROID_PLATFORM: android-36
      PGBR_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.00.11-LT' }}
      PGRAZOR_KEY_ALIAS: ${{ secrets.PGRAZOR_KEY_ALIAS }}
      PGRAZOR_STORE_PASSWORD: ${{ secrets.PGRAZOR_STORE_PASSWORD }}
      PGRAZOR_KEY_PASSWORD: ${{ secrets.PGRAZOR_KEY_PASSWORD }}
    steps:
      - name: Verificar entrada original e assinatura antes da compilacao
        env:
          PGRAZOR_INPUT_URL: ${{ secrets.PGRAZOR_INPUT_URL }}
          PGRAZOR_KEYSTORE_BASE64: ${{ secrets.PGRAZOR_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PGRAZOR_INPUT_URL)) { throw 'Configure PGRAZOR_INPUT_URL com o pacote original Niantic 0.437.0' }
          if ([string]::IsNullOrWhiteSpace($env:PGRAZOR_KEYSTORE_BASE64)) { throw 'Configure PGRAZOR_KEYSTORE_BASE64' }
          if ([string]::IsNullOrWhiteSpace($env:PGRAZOR_KEY_ALIAS)) { throw 'Configure PGRAZOR_KEY_ALIAS' }
          if ([string]::IsNullOrWhiteSpace($env:PGRAZOR_STORE_PASSWORD)) { throw 'Configure PGRAZOR_STORE_PASSWORD' }
          if ([string]::IsNullOrWhiteSpace($env:PGRAZOR_KEY_PASSWORD)) { throw 'Configure PGRAZOR_KEY_PASSWORD' }
          Write-Host 'Entradas conferidas. Nenhuma credencial sera exibida.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36" "ndk;27.3.13750724" "ndk;29.0.14206865"
      - name: Install native build tools
        run: python -m pip install "cmake==4.4.4" "ninja==1.13.2"
      - name: Configure pinned native prerequisites
        run: |
          $sdkRoot = $env:ANDROID_SDK_ROOT
          if (!$sdkRoot) { $sdkRoot = $env:ANDROID_HOME }
          if (!$sdkRoot) { throw 'Android SDK root was not configured' }
          $gameplayNdk = Join-Path $sdkRoot 'ndk/27.3.13750724'
          $artNdk = Join-Path $sdkRoot 'ndk/29.0.14206865'
          foreach ($ndkPath in @($gameplayNdk, $artNdk)) {
            if (!(Test-Path -LiteralPath (Join-Path $ndkPath 'source.properties'))) { throw "Missing pinned NDK: $ndkPath" }
          }
          $nativeDeps = Join-Path $env:RUNNER_TEMP 'pgrazor-native-deps'
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value @(
            "ANDROID_SDK_ROOT=$sdkRoot",
            "ANDROID_NDK_HOME=$gameplayNdk",
            "PGRAZOR_ART_NDK=$artNdk",
            "PGRAZOR_NATIVE_DEPS=$nativeDeps"
          )
      - name: Prepare and verify pinned native sources
        run: |
          python -B tools/prepare_native.py --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B pgrazor/art_build.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.PGBR_TAG }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Use a version tag such as v0.1.0' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and !(Test-Path -LiteralPath "docs/releases/$env:RELEASE_TAG.md")) { throw "Add release notes in docs/releases/$env:RELEASE_TAG.md" }
      - name: Prepare pinned DEX test dependencies
        run: python -c "import sys; sys.path.insert(0, 'pgrazor'); import dex_bridges; dex_bridges.dependencies(download=True)"
      - run: python -B tools/check.py
      - name: Testar ordenação de versões do atualizador
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'pgbr-version-tests'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          javac -d $out pgrazor/src/dev/pgrazor/UpdateVersion.java pgrazor/test/UpdateVersionTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp $out dev.pgrazor.UpdateVersionTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure temporary signing path
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "PGRAZOR_KEYSTORE=$env:RUNNER_TEMP\pgrazor-signing.jks"
      - name: Prepare pinned input and signing key
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PGRAZOR_INPUT_URL: ${{ secrets.PGRAZOR_INPUT_URL }}
          PGRAZOR_KEYSTORE_BASE64: ${{ secrets.PGRAZOR_KEYSTORE_BASE64 }}
        run: python -B tools/private_input.py
      - name: Build playable package
        env:
          PGRAZOR_VERSION: ${{ env.PGBR_TAG }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B pgrazor/nonroot.py --apk pgrazor/input/game.apkm --google-browser-login
      - name: Produce single installable APK
        shell: pwsh
        env:
          PGRAZOR_VERSION: ${{ env.PGBR_TAG }}
        run: |
          $candidate = Get-ChildItem -LiteralPath pgrazor/build/nonroot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (!$candidate) { throw 'Non-root package run is missing' }
          python -B pgrazor/release_apk.py --run $candidate.FullName --output dist/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build rooted installer and manual module
        # Keep this after release_apk.py: rooted.py appends both Root checksums.
        env:
          PGRAZOR_VERSION: ${{ env.PGBR_TAG }}
        run: python -B pgrazor/rooted.py pgrazor/input/game.apkm --skip-build --download --output dist/release
      - name: Verify all three release downloads
        env:
          RELEASE_TAG: ${{ env.PGBR_TAG }}
        run: python -B tools/verify_release.py dist/release --tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGBR-${{ env.PGBR_TAG }}-APKs
          path: |
            dist/release/PGBR-*.apk
            dist/release/PGBR-*.zip
            dist/release/root-build-info.json
            dist/release/SHA256SUMS.txt
            dist/release/build-info.json
          if-no-files-found: error
          retention-days: 14
      - name: Publicar pre-lancamento validado no GitHub Releases
        if: github.event_name == 'push' && github.ref_name == 'feature/lt-hud-historico-locais-20261120'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.PGBR_TAG }}
        shell: pwsh
        run: |
          # Only publish the six validated outputs, never the original game package or signing secrets.
          python -B tools/verify_release.py dist/release --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release bundle did not pass verification' }
          $names = @(
            "PGBR-$env:RELEASE_TAG.apk",
            "PGBR-$env:RELEASE_TAG-Root.apk",
            "PGBR-$env:RELEASE_TAG-Root-module.zip",
            'build-info.json',
            'root-build-info.json',
            'SHA256SUMS.txt'
          )
          $assets = @()
          foreach ($name in $names) {
            $file = Join-Path 'dist/release' $name
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing validated release asset: $name" }
            $assets += $file
          }
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Missing release notes: $notes" }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release tag already exists: $env:RELEASE_TAG (refusing to overwrite)" }
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PGBR $env:RELEASE_TAG (pre-lancamento)" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,url,assets
          if ($LASTEXITCODE -ne 0) { throw 'Published release could not be verified' }
      - name: Remove signing key
        if: always()
        shell: pwsh
        run: |
          if (!$env:PGRAZOR_KEYSTORE) { exit 0 }
          $keyPath = [IO.Path]::GetFullPath($env:PGRAZOR_KEYSTORE)
          $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if (!$keyPath.StartsWith($tempRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Key is outside runner temp' }
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath }