name: PGBR LT026 - RocketMap servidores opcionais
on:
  push:
    branches: [feat/lt026-rocketmap-multiservidor-20261121]
  pull_request:
    branches: [feat/lt025-iflowgo-live-feeds-20261121]
permissions:
  contents: read
jobs:
  feed-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android JSON
        run: sdkmanager "sources;android-36"
      - name: Testar contratos dos provedores
        run: python -B -m unittest discover -s pgrazor/test -p 'test_live_feed_java.py' -v
      - name: Testar integração de UI
        run: |
          python -B -m unittest discover -s pgrazor/test -p 'test_rocketmap_wiring.py' -v
          python -B -m unittest discover -s pgrazor/test -p 'test_iflowgo_wiring.py' -v
          python -B -m unittest discover -s pgrazor/test -p 'test_raid_feed_filters_java.py' -v
          python -B -m unittest discover -s pgrazor/test -p 'test_pokelist_access_behavior.py' -v
  android-compile:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PGRAZOR_BUILD_TOOLS: 36.0.0
      PGRAZOR_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36"
      - name: Preparar DEX
        run: python -c "import sys; sys.path.insert(0, 'pgrazor'); import dex_bridges; dex_bridges.dependencies(download=True)"
      - name: Compilar controles Android
        run: python -B pgrazor/build.py
