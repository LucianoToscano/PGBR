name: PGBR - validar identidade e website
on:
  push:
    branches: [main, feature/pt-br-traducao]
    paths:
      - 'README.md'
      - 'website/**'
      - 'pgrazor/branding/**'
      - 'pgrazor/test/test_branding.py'
      - '.github/workflows/pgbr-branding-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Checar identidade PGBR
        run: python -B -m unittest discover -s pgrazor/test -p 'test_branding.py'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Instalar dependencias do site
        working-directory: website
        run: npm ci
      - name: Compilar site
        working-directory: website
        run: npm run build
      - name: Preparar navegador
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Testar site
        working-directory: website
        run: npx playwright test
