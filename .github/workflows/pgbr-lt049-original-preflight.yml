name: PGBR LT049 - validar original 0.439.0
# Independent signed input validation; no runtime profile activation or APK publication.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pgbr-lt049-original-preflight.yml'
      - 'tools/verify_candidate_input.py'
      - 'tools/game_input_0439_manifest.json'
permissions:
  contents: read
concurrency:
  group: pgbr-lt049-original-preflight
  cancel-in-progress: false
jobs:
  validate-original:
    if: github.repository == 'LucianoToscano/PGBR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Required for access to the existing private draft asset.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Recuperar somente o original pinado do rascunho privado
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/pgbr-original.XXXXXX")"
          printf 'PGBR_ORIGINAL_TEMP=%s\n' "$dir" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/releases/452254190" > "$dir/release.json"
          asset="$(python - "$dir/release.json" <<'PY'
          import json, sys
          from pathlib import Path
          release = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected = json.loads(Path('tools/game_input_0439_manifest.json').read_text(encoding='utf-8'))
          if release.get('draft') is not True or release.get('tag_name') != 'build-inputs':
              raise SystemExit('Private draft identity mismatch')
          matches = [a for a in release.get('assets', []) if a.get('name') == 'Pokemon_GO_0.439.0_ARM64_ORIGINAL.apkm']
          if len(matches) != 1:
              raise SystemExit('Pinned candidate asset absent or ambiguous')
          a = matches[0]
          if (a.get('state') != 'uploaded' or a.get('size') != expected['archive_bytes']
                  or a.get('digest') != 'sha256:' + expected['archive_sha256']
                  or type(a.get('id')) is not int or a['id'] <= 0):
              raise SystemExit('Pinned candidate asset metadata mismatch')
          print(a['id'])
          PY
          )"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$dir/original.apkm"
      - name: Verificar assinaturas e identidade de todos os splits
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          signer="$sdk/build-tools/36.0.0/apksigner"
          analyzer="$sdk/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$signer"
          test -x "$analyzer"
          python -B tools/verify_candidate_input.py "$PGBR_ORIGINAL_TEMP/original.apkm" --require-signatures --require-manifest-identity --apksigner "$signer" --apkanalyzer "$analyzer" > "$PGBR_ORIGINAL_TEMP/identity.json"
          cat "$PGBR_ORIGINAL_TEMP/identity.json"
          printf '### LT049 original identity only\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$PGBR_ORIGINAL_TEMP/identity.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Remover entrada temporaria
        if: always()
        shell: bash
        run: |
          if [[ -n "${PGBR_ORIGINAL_TEMP:-}" && "$PGBR_ORIGINAL_TEMP" == "$RUNNER_TEMP"/pgbr-original.* && -d "$PGBR_ORIGINAL_TEMP" && ! -L "$PGBR_ORIGINAL_TEMP" ]]; then
            rm -rf -- "$PGBR_ORIGINAL_TEMP"
          fi
