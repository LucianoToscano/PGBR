<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <title>PGBR-v0.00.01-LT — Edição brasileira</title>
    <meta
      name="description"
      content="PGBR-v0.00.01-LT: interface em português brasileiro, localização, joystick, rotas e ferramentas para Pokémon GO no Android ARM64."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#141b25" />
    <link rel="canonical" href="https://github.com/LucianoToscano/PGBR" />
    <meta property="og:title" content="PGBR" />
    <meta
      property="og:description"
      content="A compact Android interface for Pokémon GO location controls, catching, and optional automation. Independent and open source."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/LucianoToscano/PGBR" />
    <meta property="og:image" content="https://raw.githubusercontent.com/LucianoToscano/PGBR/main/pgrazor/branding/pgrazor.svg" />
    <!-- Apply the saved theme before first paint (default dark) to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pgbr-theme');
          document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
        document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'light' ? '#f9fbfd' : '#141b25';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PGBR é uma ferramenta experimental independente para Android. <a href="https://github.com/LucianoToscano/PGBR/actions/workflows/pgbr-build-full-ptbr-candidate.yml">Baixar a versão de teste</a>. Enable JavaScript to explore the settings guide.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
